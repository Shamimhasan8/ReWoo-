apiVersion: v1
kind: Secret
metadata:
  name: rewoo-secrets
  namespace: rewoo
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://rewoo:CHANGE_ME@rewoo-postgres:5432/rewoo"
  redis-url: "redis://rewoo-redis:6379/0"
  celery-broker-url: "redis://rewoo-redis:6379/1"
  celery-result-backend: "redis://rewoo-redis:6379/2"
  db-password: "CHANGE_ME"
  jwt-secret: "CHANGE_ME_TO_RANDOM_STRING"
  service-token: "CHANGE_ME_TO_RANDOM_STRING"
  anthropic-api-key: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rewoo-api
  namespace: rewoo
