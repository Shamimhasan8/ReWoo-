apiVersion: apps/v1
kind: Deployment
metadata:
  name: rewoo-api
  namespace: rewoo
  labels:
    app: rewoo-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rewoo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rewoo-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: rewoo-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: rewoo/api:latest
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: REWOO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rewoo-secrets
                  key: database-url
            - name: REWOO_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rewoo-secrets
                  key: redis-url
            - name: REWOO_CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: rewoo-secrets
                  key: celery-broker-url
            - name: REWOO_CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: rewoo-secrets
                  key: celery-result-backend
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rewoo-secrets
                  key: anthropic-api-key
            - name: REWOO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rewoo-secrets
                  key: jwt-secret
            - name: REWOO_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rewoo-secrets
                  key: service-token
            - name: REWOO_AUTH_ENABLED
              value: "true"
            - name: REWOO_LOG_LEVEL
              value: "INFO"
            - name: REWOO_JSON_LOGS
              value: "true"
            - name: REWOO_DB_POOL_SIZE
              value: "20"
            - name: REWOO_SANDBOX_ENABLED
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: rewoo-api
  namespace: rewoo
  labels:
    app: rewoo-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: rewoo-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rewoo-api-hpa
  namespace: rewoo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rewoo-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
