apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rewoo-postgres
  namespace: rewoo
spec:
  serviceName: rewoo-postgres
  replicas: 1
  selector:
    matchLabels:
      app: rewoo-postgres
  template:
    metadata:
      labels:
        app: rewoo-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: rewoo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rewoo-secrets
                  key: db-password
            - name: POSTGRES_DB
              value: rewoo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - rewoo
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - rewoo
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rewoo-postgres
  namespace: rewoo
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: rewoo-postgres
